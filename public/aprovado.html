<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aluno Aprovado</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e8f5e9; color: #2e7d32; text-align: center; padding-top: 50px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #388e3c; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Parabéns!</h1>
        <p>Situação: <strong>{situacao}</strong></p>
        <p>Nota P1: {p1}</p>
        <p>Nota P2: {p2}</p>
        <p>Média Final: <strong>{media}</strong></p>
    </div>
</body>
</html>
